<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Commit Snake — ghani-code</title>
<meta name="description" content="Play snake on Abdulghani Khalid's GitHub contribution graph. Eat a year of commits." />
<meta name="theme-color" content="#0a0a0a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
  :root {
    --bg: #0a0a0a; --panel: #111111; --line: #262626;
    --ink: #fafafa; --muted: #a3a3a3; --dim: #737373;
    --yellow: #facc15; --lime: #a3e635; --amber: #fde68a;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --serif: Fraunces, 'Iowan Old Style', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    background-image:
      radial-gradient(60rem 30rem at 10% -10%, rgba(250,204,21,.10), transparent 60%),
      radial-gradient(40rem 30rem at 100% 110%, rgba(163,230,53,.07), transparent 60%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: auto, auto, 32px 32px, 32px 32px;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overscroll-behavior: none;
  }
  main { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .crumb { font-size: 13px; color: var(--dim); }
  .crumb b { color: var(--yellow); font-weight: 600; }
  .crumb a { color: inherit; text-decoration: none; }
  .crumb a:hover { color: var(--ink); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 6vw, 46px); letter-spacing: -.02em; margin: 0; line-height: 1.05; }
  h1 em { color: var(--yellow); font-weight: 500; text-shadow: 0 0 18px rgba(250,204,21,.45); }
  .hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .stat span { display: block; font-size: 11px; color: var(--dim); text-transform: lowercase; }
  .stat strong { display: block; font-size: clamp(16px, 4vw, 22px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.hot strong { color: var(--yellow); }
  .term { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #151515; font-size: 12px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3f3f46; }
  .dot.y { background: var(--yellow); }
  .bar .title { flex: 1; text-align: center; }
  .live { color: var(--lime); display: flex; align-items: center; gap: 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .stage { position: relative; flex: 1; display: grid; place-items: center; padding: 14px; min-height: 0; touch-action: none; }
  canvas { display: block; max-width: 100%; max-height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    background: rgba(10,10,10,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .card { max-width: 440px; }
  .card h2 { font-family: var(--serif); font-size: clamp(26px, 6vw, 38px); margin: 0 0 8px; font-weight: 600; }
  .card h2 em { color: var(--yellow); }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  .card p b { color: var(--ink); font-weight: 600; }
  .btn {
    font: 600 14px var(--mono); color: #171717; background: var(--yellow); border: 0; border-radius: 10px;
    padding: 12px 18px; cursor: pointer; box-shadow: 0 0 24px rgba(250,204,21,.35);
  }
  .btn:hover { background: #fde047; }
  .btn:focus-visible, .pad button:focus-visible, .ghost:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  .ghost { font: 500 13px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; margin-left: 6px; }
  .ghost:hover { color: var(--ink); border-color: #3f3f46; }
  .keys { margin-top: 14px; font-size: 12px; color: var(--dim); }
  kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; color: var(--muted); }
  .log { font-size: 12px; color: var(--dim); padding: 8px 14px; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 33px; }
  .log b { color: var(--lime); font-weight: 600; }
  .pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; margin: 4px auto 0; }
  .pad button {
    font: 600 20px var(--mono); color: var(--yellow); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pad button:active { background: #1c1c1c; border-color: var(--yellow); }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .pad { display: grid; } .keys { display: none; } }
  footer { font-size: 12px; color: var(--dim); text-align: center; padding-top: 4px; }
  footer a { color: var(--yellow); text-decoration: none; }
  @media (max-width: 560px) {
    .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bar .title { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="crumb"><a href="https://github.com/AbdulghaniKM">~/ghani-code</a>/<b>snake.sh</b></div>
      <h1>Eat a year of <em>my commits.</em></h1>
    </div>
  </header>

  <section class="hud" aria-label="score">
    <div class="stat hot"><span>score</span><strong id="score">0</strong></div>
    <div class="stat"><span>commits left</span><strong id="left">—</strong></div>
    <div class="stat"><span>time</span><strong id="time">0.0s</strong></div>
    <div class="stat"><span>best</span><strong id="best">—</strong></div>
  </section>

  <section class="term">
    <div class="bar">
      <span class="dot"></span><span class="dot"></span><span class="dot y"></span>
      <span class="title">contributions.grid — Oct 2025 → Oct 2026</span>
      <span class="live"><i></i>live</span>
    </div>
    <div class="stage" id="stage">
      <canvas id="board" aria-label="snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="card" id="card"></div>
      </div>
    </div>
    <div class="log" id="log">$ waiting for input…</div>
  </section>

  <nav class="pad" aria-label="direction controls">
    <button class="up" data-dir="up" aria-label="up">↑</button>
    <button class="left" data-dir="left" aria-label="left">←</button>
    <button class="down" data-dir="down" aria-label="down">↓</button>
    <button class="right" data-dir="right" aria-label="right">→</button>
  </nav>

  <footer>Each square is a real day of commits. Brighter squares are worth more. · <a href="https://ghani-code.vercel.app">ghani-code ↗</a></footer>
</main>

<script>
(() => {
  // Contribution levels (0–4), one per day, starting on a Sunday. Same data as assets/snake-*.svg.
  const START = "2025-10-19";
  const LEVELS = "00000001000111001000001011010112201100101121111221011210010010001102221000000000100001111101111202211210310011121112113110111122024031421211211121221210111010112101001301003231110113112111110000100010001110001000000200000001311221312220012112203223110334321124142212134311331321021131102111111121232243144421312330111231102422011211121232321144324222324112113110313141111";

  const COLORS = ["#161616", "#3f6212", "#65a30d", "#a3e635", "#facc15"];
  const POINTS = [0, 1, 2, 3, 5];
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const BEST_KEY = "ghani-commit-snake-best";

  const $ = (id) => document.getElementById(id);
  const canvas = $("board"), ctx = canvas.getContext("2d");
  const stage = $("stage"), overlay = $("overlay"), card = $("card");
  const ui = { score: $("score"), left: $("left"), time: $("time"), best: $("best"), log: $("log") };

  const dayOf = (i) => {
    const d = new Date(START + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + i);
    return d.toLocaleDateString("en", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  };

  // Wide screens get the real graph (weeks as columns); narrow screens get two weeks per row.
  let layout, cols, rows, cell, gap;
  function pickLayout() {
    const wide = stage.clientWidth >= 720 && stage.clientWidth > stage.clientHeight * 1.6;
    layout = wide ? "graph" : "stack";
    if (wide) { cols = Math.ceil(LEVELS.length / 7); rows = 7; }
    else { cols = 14; rows = Math.ceil(LEVELS.length / 14); }
  }
  const posOf = (i) => layout === "graph" ? [Math.floor(i / 7), i % 7] : [i % 14, Math.floor(i / 14)];

  let grid, dayAt, snake, dir, queue, alive, running, paused, score, left, total, startT, elapsed, lastStep, speed, pops;

  function reset() {
    pickLayout();
    grid = Array.from({ length: rows }, () => Array(cols).fill(-1));
    dayAt = Array.from({ length: rows }, () => Array(cols).fill(-1));
    total = 0; score = 0;
    [...LEVELS].forEach((l, i) => {
      const [x, y] = posOf(i);
      grid[y][x] = +l; dayAt[y][x] = i;
      if (+l > 0) total++;
    });
    // Start in an empty-ish spot on the left middle, heading right.
    const sy = Math.floor(rows / 2), sx = 2;
    snake = [[sx, sy], [sx - 1, sy], [sx - 2, sy]];
    snake.forEach(([x, y]) => { if (grid[y][x] > 0) total--; grid[y][x] = grid[y][x] >= 0 ? 0 : -1; });
    left = total;
    dir = "right"; queue = [];
    alive = true; running = false; paused = false;
    elapsed = 0; speed = 150; pops = [];
    resize(); updateHud(); draw();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const availW = stage.clientWidth - 28, availH = Math.max(stage.clientHeight - 28, 200);
    const unit = Math.max(6, Math.floor(Math.min(availW / cols, availH / rows)));
    cell = unit; gap = Math.max(1, Math.round(unit * 0.16));
    const w = cols * unit, h = rows * unit;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const s = cell - gap, r = Math.max(1.5, s * 0.2);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const l = grid[y][x];
      if (l < 0) continue;
      ctx.fillStyle = COLORS[l];
      if (l === 4) { ctx.shadowColor = "rgba(250,204,21,.6)"; ctx.shadowBlur = 8; }
      rrect(x * cell + gap / 2, y * cell + gap / 2, s, s, r); ctx.fill();
      ctx.shadowBlur = 0;
    }
    // snake: head bright yellow with glow, body fades toward amber/lime
    snake.forEach(([x, y], i) => {
      const t = i / Math.max(1, snake.length - 1);
      const inset = i === 0 ? 0 : Math.min(s * 0.18, 1 + t * s * 0.18);
      ctx.fillStyle = i === 0 ? "#facc15" : `hsl(${48 + t * 30}, 92%, ${58 - t * 14}%)`;
      if (i === 0) { ctx.shadowColor = "rgba(250,204,21,.9)"; ctx.shadowBlur = 14; }
      rrect(x * cell + gap / 2 + inset, y * cell + gap / 2 + inset, s - inset * 2, s - inset * 2, r); ctx.fill();
      ctx.shadowBlur = 0;
    });
    // eyes
    if (snake.length) {
      const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
      const cx = hx * cell + cell / 2, cy = hy * cell + cell / 2, o = s * 0.2, e = Math.max(1, s * 0.09);
      ctx.fillStyle = "#171717";
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(cx + dx * o + dy * o * side, cy + dy * o + dx * o * side, e, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // pop rings where commits were eaten
    const now = performance.now();
    pops = pops.filter((p) => now - p.t < 450);
    pops.forEach((p) => {
      const k = (now - p.t) / 450;
      ctx.strokeStyle = `rgba(250,204,21,${1 - k})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x * cell + cell / 2, p.y * cell + cell / 2, cell * (0.4 + k * 1.1), 0, Math.PI * 2); ctx.stroke();
    });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    let nx = (snake[0][0] + dx + cols) % cols, ny = (snake[0][1] + dy + rows) % rows;
    // trailing cells past the last day don't exist on the board; skip over them
    let guard = 0;
    while (grid[ny][nx] < 0 && guard++ < Math.max(cols, rows)) { nx = (nx + dx + cols) % cols; ny = (ny + dy + rows) % rows; }

    const lvl = grid[ny][nx];
    const target = 4 + Math.floor((total - left) / 6);
    const growing = snake.length < Math.min(target, 60);
    const body = growing ? snake : snake.slice(0, -1);
    if (body.some(([x, y]) => x === nx && y === ny)) return die();

    snake.unshift([nx, ny]);
    if (!growing) snake.pop();

    if (lvl > 0) {
      grid[ny][nx] = 0; left--; score += POINTS[lvl];
      pops.push({ x: nx, y: ny, t: performance.now() });
      const n = lvl === 4 ? "10+" : ["", "1–2", "3–5", "6–9"][lvl];
      ui.log.innerHTML = `$ ate <b>${dayOf(dayAt[ny][nx])}</b> · ${n} contributions · +${POINTS[lvl]}`;
      speed = Math.max(70, 150 - Math.floor((total - left) / 4));
      if (navigator.vibrate && lvl === 4) navigator.vibrate(12);
      if (left === 0) return win();
    }
    updateHud();
  }

  function loop(t) {
    if (!running) return;
    if (!paused) {
      elapsed += t - (lastStep.frame || t);
      lastStep.frame = t;
      if (t - lastStep.t >= speed) { lastStep.t = t; step(); }
      ui.time.textContent = (elapsed / 1000).toFixed(1) + "s";
    } else lastStep.frame = t;
    draw();
    if (running) requestAnimationFrame(loop);
  }

  function start() {
    if (!alive || left === 0) reset();
    overlay.hidden = true; running = true; paused = false;
    lastStep = { t: performance.now(), frame: 0 };
    ui.log.textContent = "$ ./snake.sh --eat-commits";
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!running) return start();
    paused = !paused;
    if (paused) show("Paused.", "Take a breath. Your commits aren't going anywhere.", "resume");
    else overlay.hidden = true;
  }

  function readBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY)); } catch { return null; } }
  function saveBest(b) { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch {} }

  function die() {
    alive = false; running = false;
    const best = readBest();
    const isBest = !best || score > best.score;
    if (isBest) saveBest({ score, won: false });
    const eaten = total - left;
    show("<em>Bit</em> yourself.", `You ate <b>${eaten}</b> of <b>${total}</b> commit days for <b>${score}</b> points.${isBest ? " New best!" : ""}`, "try again");
    updateHud();
  }

  function win() {
    alive = false; running = false;
    const t = elapsed / 1000;
    const best = readBest();
    const isBest = !best || !best.won || t < best.time;
    if (isBest) saveBest({ score, won: true, time: t });
    show("A whole year, <em>eaten.</em>", `Every commit day gone in <b>${t.toFixed(1)}s</b> with <b>${score}</b> points.${isBest ? " New best!" : ""} Build interfaces, ship fast, sleep later.`, "play again");
    updateHud();
  }

  function show(title, body, cta) {
    card.innerHTML = `<h2>${title}</h2><p>${body}</p><button class="btn" id="go">${cta} ↵</button>` +
      (cta === "resume" ? "" : `<a class="ghost" href="https://github.com/AbdulghaniKM">back to profile</a>`) +
      `<div class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> · <kbd>space</kbd> pause</div>`;
    overlay.hidden = false;
    $("go").onclick = () => (cta === "resume" ? togglePause() : start());
    $("go").focus({ preventScroll: true });
  }

  function updateHud() {
    ui.score.textContent = score;
    ui.left.textContent = `${left} / ${total}`;
    const b = readBest();
    ui.best.textContent = !b ? "—" : b.won ? `${b.time.toFixed(1)}s ✓` : `${b.score} pts`;
  }

  function turn(d) {
    if (!running) start();
    const last = queue.length ? queue[queue.length - 1] : dir;
    const [ax, ay] = DIRS[last], [bx, by] = DIRS[d];
    if (ax + bx === 0 && ay + by === 0) return; // no instant reversal
    if (d !== last && queue.length < 3) queue.push(d);
  }

  const KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  addEventListener("keydown", (e) => {
    if (KEYMAP[e.key]) { e.preventDefault(); if (!paused) turn(KEYMAP[e.key]); }
    else if (e.key === " " || e.key === "Escape" || e.key === "p") { e.preventDefault(); togglePause(); }
    else if (e.key === "Enter" && !overlay.hidden) { e.preventDefault(); $("go")?.click(); }
  });

  document.querySelectorAll(".pad button").forEach((b) =>
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); if (paused) togglePause(); turn(b.dataset.dir); }));

  let touch = null;
  stage.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") touch = [e.clientX, e.clientY]; });
  stage.addEventListener("pointerup", (e) => {
    if (!touch) return;
    const dx = e.clientX - touch[0], dy = e.clientY - touch[1];
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24 || !overlay.hidden) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const before = layout; pickLayout();
      if (before !== layout && running) { running = false; reset(); show("Board reshaped.", "The screen changed shape, so the board did too.", "start"); }
      else { resize(); draw(); }
    }, 150);
  });

  reset();
  show("Commit <em>Snake.</em>", `This board is my real GitHub contribution graph: <b>${total}</b> days with commits from Oct 2025 to Oct 2026. Eat them all. Brighter squares score more, edges wrap around, and you get faster as you go.`, "start");
})();
</script>
</body>
</html>
