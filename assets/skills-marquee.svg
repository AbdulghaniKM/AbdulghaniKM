<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="skills.sh: Vue, Nuxt, TypeScript, Tailwind CSS, React, Next.js, NestJS, PostgreSQL, C#, Python and more">
