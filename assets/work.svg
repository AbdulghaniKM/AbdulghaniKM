<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="04 Selected work.">
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .serif{font-family:Fraunces,'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif}
    .in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
    .draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.6s .3s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .dot{animation:dot 2.4s ease-in-out infinite}
    @keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <rect width="1200" height="120" rx="14" fill="#0a0a0a"/>
  <rect x=".5" y=".5" width="1199" height="119" rx="14" fill="none" stroke="#262626"/>
  <text class="mono" x="40" y="40" font-size="13" fill="#737373">~/ghani-code/<tspan fill="#facc15">work</tspan></text>
  <g class="in">
    <text class="serif" x="38" y="88" font-size="44" font-weight="600" fill="#fafafa" letter-spacing="-1"><tspan class="mono" font-size="20" font-weight="500" fill="#facc15" dy="-20">04</tspan><tspan dx="12" dy="20">Selected work.</tspan></text>
  </g>
  <text class="mono in" style="animation-delay:.25s" x="1160" y="88" font-size="14" fill="#a3a3a3" text-anchor="end">real projects, real clients</text>
  <line class="draw" x1="40" y1="104" x2="1160" y2="104" stroke="#facc15" stroke-opacity=".55"/>
  <circle class="dot" cx="1160" cy="40" r="4" fill="#a3e635"/>
</svg>
