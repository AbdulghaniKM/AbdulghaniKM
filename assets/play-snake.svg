<svg xmlns="http://www.w3.org/2000/svg" width="260" height="52" viewBox="0 0 260 52" role="img" aria-label="Play Commit Snake">
  <defs>
    <filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .glow{animation:glow 2.2s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
      .tri{animation:nudge 1.1s ease-in-out infinite}
      @keyframes nudge{50%{transform:translateX(3px)}}
    </style>
  </defs>
  <rect class="glow" x="6" y="6" width="248" height="40" rx="12" fill="#facc15" filter="url(#g)" opacity=".6"/>
  <rect x="6" y="6" width="248" height="40" rx="12" fill="#facc15"/>
  <path class="tri" d="M26 17 L38 26 L26 35 Z" fill="#171717"/>
  <text class="mono" x="50" y="31" font-size="15" font-weight="700" fill="#171717">play commit snake</text>
</svg>
