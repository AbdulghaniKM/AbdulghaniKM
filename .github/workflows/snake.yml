name: generate contribution snake

# Refreshes assets/snake-*.svg. Manual-only until Actions billing is sorted;
# add a schedule back afterwards, e.g.:
#   schedule:
#     - cron: "17 */12 * * *"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?color_snake=#facc15&color_dots=#161616,#3f6212,#65a30d,#a3e635,#facc15&color_dot_border=#ffffff0a
            assets/snake-light.svg?color_snake=#ca8a04&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212

      - name: commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          git diff --cached --quiet || git commit -m "Refresh contribution snake"
          git push
