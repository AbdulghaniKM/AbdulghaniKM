name: generate contribution snake

# Manual-only until Actions billing is sorted; add back a schedule afterwards:
#   schedule:
#     - cron: "17 */12 * * *"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#facc15&color_dots=#161616,#3f6212,#65a30d,#a3e635,#facc15
            dist/snake-light.svg?color_snake=#ca8a04&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
